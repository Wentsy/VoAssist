# XcodeGen spec: `xcodegen generate` writes VoAssist.xcodeproj.
# App + voice extension (AVSpeechSynthesisProviderAudioUnit). Both compile Sources/BoostCore directly.
# Bundle ids, App Group and the AudioComponent codes must stay in step with:
#   Sources/BoostCore/SharedSettings.swift (SharedStore.groupID), Sources/BoostCore/Scheme.swift (VoiceScheme.providerPrefix)
#   App/ExtensionProbe.swift (extensionComponent)
name: VoAssist
options:
  bundleIdPrefix: com.zdyi
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Sources/CSonic: Bill Cox's Sonic (C), imported by BoostCore as the CSonic module
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CSonic/include
    HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/CSonic/include
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "25"
    DEVELOPMENT_TEAM: H9V8GVBZSS
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  VoAssist:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - Info.plist
      - Sources/BoostCore
      - path: Sources/CSonic/sonic.c
      - path: Sources/CSonic/LICENSE
        buildPhase: resources
    entitlements:
      path: App/VoAssist.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zdyi.voassist
    # merged with the generated Info.plist: the shared-scheme file type (.voassist), opened from other apps
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: 旁白助手方案
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.zdyi.voassist.share
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.zdyi.voassist.share
            UTTypeDescription: 旁白助手方案
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - voassist
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zdyi.voassist
        INFOPLIST_KEY_CFBundleDisplayName: 旁白助手
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VoAssistVoice
        embed: true
  VoAssistVoice:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - Info.plist
          - "*.entitlements"
      - Sources/BoostCore
      - path: Sources/CSonic/sonic.c
    entitlements:
      path: Extension/VoAssistVoice.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zdyi.voassist
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: 旁白助手语音
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BoostAudioUnitFactory
          NSExtensionAttributes:
            AudioComponents:
              - type: ausp
                subtype: VoAs
                manufacturer: Zdyi
                name: "旁白助手: 旁白助手"
                description: 旁白助手 Speech Synthesizer
                tags:
                  - Speech Synthesizer
                version: 1
                sandboxSafe: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zdyi.voassist.voice
        SKIP_INSTALL: YES
