name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: bash scripts/build-ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoAssist-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error
